<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Global Wellbeing Map</title>

<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root { --ink:#172033; --muted:#687086; --panel:#ffffffee; --line:#e7eaf0; --shadow:0 18px 55px rgba(18,31,56,.16); }

* { box-sizing: border-box; }

body {
  margin:0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color:var(--ink);
  background:#eef2f7;
}

#map {
  width:100vw;
  height:100vh;
  background:#dfe8f2;
}

.brand {
  position:absolute;
  z-index:999;
  top:18px;
  left:18px;
  width:310px;
  padding:16px 18px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--panel);
  box-shadow:var(--shadow);
  backdrop-filter: blur(14px);
}

.eyebrow {
  font-size:9px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#596276;
  font-weight:800;
}

h1 {
  margin:6px 0 5px;
  font-size:22px;
  line-height:1.05;
  letter-spacing:-.04em;
}

.subtitle {
  margin:0 0 12px;
  color:var(--muted);
  font-size:12px;
  line-height:1.35;
}

.controls {
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}

select {
  width:100%;
  border:1px solid #d9deea;
  background:white;
  border-radius:12px;
  padding:9px 10px;
  font-size:12px;
  font-weight:700;
  color:#1d2740;
  outline:none;
}

.stats {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:6px;
  margin-top:10px;
}

.stat {
  background:#f7f9fc;
  border:1px solid #e8ecf4;
  border-radius:13px;
  padding:8px;
}

.stat b {
  display:block;
  font-size:15px;
  letter-spacing:-.03em;
}

.stat span {
  display:block;
  margin-top:2px;
  font-size:9px;
  color:var(--muted);
  font-weight:700;
}

.rank {
  position:absolute;
  z-index:999;
  right:18px;
  top:18px;
  width:200px;
  max-height:calc(100vh - 36px);
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--panel);
  box-shadow:var(--shadow);
  backdrop-filter: blur(14px);
}

.rank header {
  padding:12px 13px 9px;
  border-bottom:1px solid var(--line);
}

.rank h2 {
  margin:0;
  font-size:14px;
  letter-spacing:-.03em;
}

.rank p {
  margin:3px 0 0;
  color:var(--muted);
  font-size:9px;
}

#rankList {
  padding:5px 6px 9px;
  max-height:calc(100vh - 105px);
  overflow:auto;
}

.item {
  display:grid;
  grid-template-columns:20px 1fr auto;
  gap:5px;
  align-items:center;
  padding:5px 6px;
  border-radius:10px;
}

.item:hover {
  background:#f2f5fa;
}

.num {
  width:18px;
  height:18px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#172033;
  color:#fff;
  font-size:9px;
  font-weight:800;
}

.country {
  font-weight:800;
  font-size:11px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.value {
  font-variant-numeric: tabular-nums;
  font-size:10px;
  font-weight:800;
}

.legend {
  position:absolute;
  z-index:999;
  left:18px;
  bottom:18px;
  width:310px;
  padding:12px 14px;
  border-radius:18px;
  border:1px solid var(--line);
  background:var(--panel);
  box-shadow:var(--shadow);
}

.legend-title {
  font-size:11px;
  font-weight:900;
  margin-bottom:8px;
}

.swatches {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  overflow:hidden;
  border-radius:999px;
  height:10px;
}

.swatches div {
  height:10px;
}

.scale {
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  margin-top:6px;
}

.leaflet-container {
  font: inherit;
}

.leaflet-popup-content-wrapper {
  border-radius:18px;
  box-shadow:0 18px 55px rgba(17,28,48,.22);
}

.popup-title {
  font-size:16px;
  font-weight:900;
  margin-bottom:8px;
}

.popup-grid {
  display:grid;
  grid-template-columns:1fr auto;
  gap:5px 14px;
  min-width:210px;
}

.popup-grid span:nth-child(odd) {
  color:#687086;
}

.popup-grid span:nth-child(even) {
  font-weight:900;
  font-variant-numeric: tabular-nums;
}

@media (max-width:900px) {
  .brand,
  .legend,
  .rank {
    position:relative;
    inset:auto;
    width:auto;
    margin:12px;
  }

  #map {
    height:70vh;
  }

  body {
    overflow:auto;
  }
}
</style>
</head>

<body>
<div id="map"></div>

<section class="brand">
  <div class="eyebrow">Country-level wellbeing dashboard</div>
  <h1>Global Wellbeing Map</h1>
  <p class="subtitle">Click on countries for full details.</p>

  <div class="controls">
    <select id="metricSelect"></select>
  </div>

  <div class="stats">
    <div class="stat"><b id="coverage">—</b><span>Countries</span></div>
    <div class="stat"><b id="avg">—</b><span>Average</span></div>
    <div class="stat"><b id="top">—</b><span>Top value</span></div>
  </div>
</section>

<section class="rank">
  <header>
    <h2>Top countries</h2>
    <p id="rankSubtitle">Ranked by selected metric</p>
  </header>
  <div id="rankList"></div>
</section>

<section class="legend">
  <div class="legend-title" id="legendTitle">Legend</div>
  <div class="swatches" id="swatches"></div>
  <div class="scale">
    <span id="minLabel">Low</span>
    <span id="maxLabel">High</span>
  </div>
</section>

const METRICS = {"Happiness_Score": {"label": "Happiness score", "format": ".3f", "palette": ["#edf8fb", "#b3cde3", "#8c96c6", "#8856a7", "#810f7c"]}, "Democracy_Score": {"label": "Democracy score", "format": ".2f", "palette": ["#f7fcf5", "#c7e9c0", "#74c476", "#238b45", "#00441b"]}, "gdp_per_capita_ppp": {"label": "GDP per capita PPP", "format": "$,.0f", "palette": ["#fff7bc", "#fee391", "#fec44f", "#fe9929", "#d95f0e"]}, "life_expectancy": {"label": "Life expectancy", "format": ".1f", "palette": ["#f7fbff", "#c6dbef", "#6baed6", "#2171b5", "#08306b"]}, "unemployment_rate": {"label": "Unemployment rate", "format": ".1f%", "palette": ["#ffffcc", "#ffeda0", "#feb24c", "#f03b20", "#bd0026"]}, "homicide_rate": {"label": "Homicide rate", "format": ".2f", "palette": ["#ffffd4", "#fed98e", "#fe9929", "#d95f0e", "#993404"]}, "perceived_safety": {"label": "Perceived safety", "format": ".1f", "palette": ["#d1fae5", "#6ee7b7", "#2dd4bf", "#0ea5e9", "#1e40af"]}, "lgbt_equality_index": {"label": "LGBT equality index", "format": ".1f", "palette": ["#f2f0f7", "#cbc9e2", "#9e9ac8", "#756bb1", "#54278f"]}, "gender_equality_index": {"label": "Gender equality index", "format": ".2f", "palette": ["#fff5f0", "#fcbba1", "#fb6a4a", "#cb181d", "#67000d"]}};

const aliases = {
  'United States of America':'United States',
  'Czechia':'Czech Republic',
  'Republic of Serbia':'Serbia',
  'Bosnia and Herz.':'Bosnia and Herzegovina',
  'Dominican Rep.':'Dominican Republic',
  'North Macedonia':'Macedonia',
  'S. Korea':'South Korea',
  'Korea':'South Korea',
  'Russia':'Russian Federation',
  'Iran':'Iran',
  'Vietnam':'Viet Nam',
  'Laos':'Lao PDR',
  'Moldova':'Moldova',
  'Tanzania':'Tanzania',
  'Bolivia':'Bolivia',
  'Venezuela':'Venezuela',
  'Syria':'Syrian Arab Republic'
};

function rowFor(name) {
  return DATA[name] || DATA[aliases[name]] || null;
}

function values(metric) {
  return Object.values(DATA)
    .map(d => d[metric])
    .filter(v => Number.isFinite(v));
}

function fmt(metric, v) {
  if (!Number.isFinite(v)) return 'No data';

  const f = METRICS[metric].format;

  if (f === '$,.0f') return '$' + Math.round(v).toLocaleString();
  if (f === '.1f%') return v.toFixed(1) + '%';
  if (f === '.3f') return v.toFixed(3);
  if (f === '.2f') return v.toFixed(2);

  return v.toFixed(1);
}

function quantiles(arr) {
  const s = [...arr].sort((a, b) => a - b);

  return [0, .2, .4, .6, .8, 1].map(q =>
    s[Math.min(s.length - 1, Math.floor(q * (s.length - 1)))]
  );
}

function colorFor(metric, v) {
  if (!Number.isFinite(v)) return '#d7dde7';

  const qs = quantiles(values(metric));
  const p = METRICS[metric].palette;

  for (let i = 1; i < qs.length; i++) {
    if (v <= qs[i]) return p[i - 1];
  }

  return p[p.length - 1];
}

const map = L.map('map', {
  zoomControl:false,
  worldCopyJump:true,
  minZoom:2
}).setView([24, 10], 2.25);

L.control.zoom({ position:'bottomright' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap &copy; CARTO',
  maxZoom:8
}).addTo(map);

let layer;
let currentMetric = 'Happiness_Score';

const select = document.getElementById('metricSelect');

Object.entries(METRICS).forEach(([k, m]) => {
  const option = document.createElement('option');
  option.value = k;
  option.textContent = m.label;
  select.appendChild(option);
});

function styleFeature(feature) {
  const d = rowFor(feature.properties.name);
  const v = d ? d[currentMetric] : null;

  return {
    fillColor: colorFor(currentMetric, v),
    weight: .75,
    color: '#ffffff',
    fillOpacity: .88,
    opacity: .85
  };
}

function popupHtml(country, d) {
  if (!d) {
    return `<div class="popup-title">${country}</div><p>No matched data in CSV.</p>`;
  }

  return `
    <div class="popup-title">${d.Country}</div>
    <div class="popup-grid">
      ${Object.entries(METRICS).map(([k, m]) =>
        `<span>${m.label}</span><span>${fmt(k, d[k])}</span>`
      ).join('')}
    </div>
  `;
}

function onEachFeature(feature, lyr) {
  lyr.on({
    mouseover: e => {
      e.target.setStyle({
        weight: 2.2,
        color: '#172033',
        fillOpacity: .96
      });

      e.target.bringToFront();
    },

    mouseout: e => layer.resetStyle(e.target),

    click: e => {
      const d = rowFor(feature.properties.name);
      lyr.bindPopup(popupHtml(feature.properties.name, d)).openPopup();
    }
  });
}

function updatePanels() {
  const vals = values(currentMetric);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;

  const ranked = Object.values(DATA)
    .filter(d => Number.isFinite(d[currentMetric]))
    .sort((a, b) => b[currentMetric] - a[currentMetric]);

  document.getElementById('coverage').textContent = vals.length;
  document.getElementById('avg').textContent = fmt(currentMetric, avg);
  document.getElementById('top').textContent = fmt(currentMetric, ranked[0][currentMetric]);

  document.getElementById('rankSubtitle').textContent =
    'Ranked by ' + METRICS[currentMetric].label.toLowerCase();

  document.getElementById('rankList').innerHTML = ranked.slice(0, 15).map((d, i) => `
    <div class="item">
      <div class="num">${i + 1}</div>
      <div class="country">${d.Country}</div>
      <div class="value">${fmt(currentMetric, d[currentMetric])}</div>
    </div>
  `).join('');

  document.getElementById('legendTitle').textContent = METRICS[currentMetric].label;

  document.getElementById('swatches').innerHTML =
    METRICS[currentMetric].palette.map(c =>
      `<div style="background:${c}"></div>`
    ).join('');

  document.getElementById('minLabel').textContent = fmt(currentMetric, Math.min(...vals));
  document.getElementById('maxLabel').textContent = fmt(currentMetric, Math.max(...vals));
}

select.addEventListener('change', e => {
  currentMetric = e.target.value;
  layer.setStyle(styleFeature);
  updatePanels();
});

fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
  .then(r => r.json())
  .then(geo => {
    layer = L.geoJSON(geo, {
      style: styleFeature,
      onEachFeature
    }).addTo(map);

    updatePanels();
  });
</script>
